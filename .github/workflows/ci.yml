name: CI

on:
  pull_request:
  push:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXTAUTH_SECRET: "12345678901234567890123456789012" # Dummy 32-char key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'
          cache: 'npm'
      - name: Show versions
        run: |
          node -v
          npm -v
          npx eslint -v || true
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint -- --no-cache
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build

        run: npx next build